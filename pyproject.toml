[project]
name = "edth"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "osmium>=4.3.1",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "rasterio>=1.5.2",
    "turingdb>=3.0",
]

[project.optional-dependencies]
voice = [
    "fastapi>=0.115",
    "nemo-toolkit[asr]>=2.4",
    "python-multipart>=0.0.20",
    "sentence-transformers>=3.0",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
